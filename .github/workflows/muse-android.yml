name: Muse Core

# 穿云 core (fork of hiddify-core, GPLv3).
# Builds the Android AAR (`make android-libs` in the app) and the Windows x64 library
# (`make windows-libs`: hiddify-core.dll + libcronet.dll + HiddifyCli.exe, like upstream).
# Push to muse -> artifacts. Tag v*-muse* -> one GitHub Release with
# hiddify-lib-android.tar.gz and hiddify-lib-windows-amd64.tar.gz.
on:
  push:
    # net-*: 穿云 network fix branches (tests + builds, no release)
    branches: [muse, 'net-*']
    tags: ['v*-muse*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Submodules (ssh urls -> https)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Apply Muse patches to hiddify-sing-box
        run: |
          for p in patches/hiddify-sing-box/*.patch; do
            echo "applying $p"
            git -C hiddify-sing-box apply --verbose "../$p"
          done

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Muse unit tests
        run: |
          go test -ldflags=-checklinkname=0 -tags with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc ./v2/config/ -run 'Muse|TestSetInbound|RouteRule|DNSGroup' -count=1 -v 2>&1 | tee /tmp/muse-config.log | grep -E '^(=== RUN|--- |PASS|FAIL|ok|panic)|_test.go' 
          test ${PIPESTATUS[0]} -eq 0
          # 穿云 core muse.18: domestic DNS / direct routing (muse_dns_test.go)
          for t in MuseDirectDNSGroupAddresses MuseRemoteDNSGroupAddresses MuseDomesticDNSIsDirectAndDomestic MuseDomesticTrafficGoesDirect MuseResolveRulePlacement MuseDomesticQUICNotRejected BuildConfigDNSGroups; do
            grep -q -- "--- PASS: Test$t " /tmp/muse-config.log || { echo "::error::Test$t did not run/pass"; exit 1; }
          done
          go test -ldflags=-checklinkname=0 -tags with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc ./v2/hcore/ -run 'TestSpeedSince' -count=1 -v

      # 穿云 1.2.1: steady node delays (patch 0003) + the monitoring / balancer tests around them;
      # the timing test logs "muse timing:" (single probe vs thorough test of 30 nodes)
      - name: Muse sing-box tests (monitoring / balancer)
        working-directory: hiddify-sing-box
        run: |
          go test -ldflags=-checklinkname=0 -tags with_gvisor,with_quic,with_utls,with_clash_api ./common/monitoring/ ./protocol/group/balancer/ -count=1 -v 2>&1 | grep -E '^(=== RUN|--- |PASS|FAIL|ok|panic)|_test.go|muse timing'
          test ${PIPESTATUS[0]} -eq 0
          # 穿云 core muse.15/16: REALITY key share by fingerprint (chrome PQ, firefox/randomized X25519)
          # + one retry with the other mode, cached per server (patches 0008, 0009)
          # 穿云 core muse.17: client version 26.10.21 in the session ID (patch 0010)
          go test -ldflags=-checklinkname=0 -tags with_utls ./common/tls/ -run 'MuseReality' -count=1 -v 2>&1 | tee /tmp/muse-reality.log
          test ${PIPESTATUS[0]} -eq 0
          for t in ModeChrome ModeFirefox ModeRandomized ModeRandomizedNoALPN ModeCache RetryOtherMode RetryNoAlternate RetryNextConnection VersionBytes VersionInHello; do
            grep -q -- "--- PASS: TestMuseReality$t " /tmp/muse-reality.log || { echo "::error::TestMuseReality$t did not run/pass"; exit 1; }
          done
          # 穿云 core muse.19: DNS query view (patch 0011) - client hook + local API /dns/queries
          go test -ldflags=-checklinkname=0 -tags with_clash_api ./dns/ ./experimental/clashapi/ -run 'Muse' -count=1 -v 2>&1 | tee /tmp/muse-dns-view.log | grep -E '^(--- |FAIL|ok|panic)|_test.go'
          test ${PIPESTATUS[0]} -eq 0
          for t in MuseQueryNoHookRecordsNothing MuseQueryExchangeAndCacheHit MuseQueryLookupCached MuseQueryErrorAndAsync MuseQueryGroupMember MuseQueryHookInstalledMidQuerySkipped MuseQueryClearOnlyOwnHook MuseFormatAddress MuseDNSRecorderOnlyWhileSubscribed MuseDNSRecorderRing MuseDNSRecorderCloseRemovesHook MuseDNSWebsocket; do
            grep -q -- "--- PASS: Test$t " /tmp/muse-dns-view.log || { echo "::error::Test$t did not run/pass"; exit 1; }
          done
          go test -ldflags=-checklinkname=0 -tags with_clash_api ./dns/ ./dns/transport/ ./experimental/clashapi/ -count=1

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Build AAR
        run: make android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CODE_VERSION: "-X github.com/hiddify/hiddify-core/v2/hcommon/constants.Version=${{ github.ref_name }}"

      - name: Package
        working-directory: bin
        run: |
          ls -la
          tar -czvf hiddify-lib-android.tar.gz ./hiddify-core.aar

      - uses: actions/upload-artifact@v4
        with:
          name: hiddify-lib-android
          path: bin/hiddify-lib-android.tar.gz
          retention-days: 14

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false

      - name: Submodules (ssh urls -> https)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Apply Muse patches to hiddify-sing-box
        run: |
          for p in patches/hiddify-sing-box/*.patch; do
            echo "applying $p"
            git -C hiddify-sing-box apply --verbose "../$p"
          done

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      # same toolchain as upstream build.yml (hiddify-lib-windows-amd64)
      - name: Setup MinGW
        id: mingw
        uses: egor-tensin/setup-mingw@v2
        timeout-minutes: 8
        continue-on-error: true
        with:
          platform: x64

      # muse.15 tag run hung 45+ min inside the step above; retry with plain apt under a time cap
      - name: Setup MinGW (fallback)
        if: steps.mingw.outcome != 'success'
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            sudo timeout 300 apt-get update -q && sudo timeout 400 apt-get install -y -q mingw-w64 && break
            echo "::warning::mingw install attempt $i failed"; sleep 10
          done
          x86_64-w64-mingw32-gcc --version

      - name: Build Windows library + CLI
        run: make windows-amd64
        env:
          CODE_VERSION: "-X github.com/hiddify/hiddify-core/v2/hcommon/constants.Version=${{ github.ref_name }}"

      - name: Package
        working-directory: bin
        run: |
          ls -la
          for f in hiddify-core.dll libcronet.dll HiddifyCli.exe; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          tar -czvf hiddify-lib-windows-amd64.tar.gz ./hiddify-core.dll ./libcronet.dll ./HiddifyCli.exe

      - uses: actions/upload-artifact@v4
        with:
          name: hiddify-lib-windows-amd64
          path: bin/hiddify-lib-windows-amd64.tar.gz
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hiddify-lib-android.tar.gz
            dist/hiddify-lib-windows-amd64.tar.gz
          prerelease: true
